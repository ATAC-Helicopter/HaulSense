# HaulSense 0.8.0
# 0.0 disables an effect family; 1.0 is maximum.
rumble_strength=0.22
road_strength=0.28
trigger_strength=0.66
brake_haptic_strength=0.38
lightbar_strength=0.68
beacon_strength=0.24
bump_threshold=0.46

# Off by default: avoid unnecessary persistent color changes.
overspeed_warning=false
critical_lightbar_warnings=true

# Player LEDs use one atomic HID mask with instant updates (no firmware fade).
# Legacy sysfs_player_leds entries are ignored.
# Player commands update only on mask changes; rumble/RGB do not retrigger them.
# Sweep requests the inner LED, then the complete selected pair.

# Five player LEDs, physical layout left -> right: player5 player4 player3 player2 player1
# Direction is chosen from ATS logical left/right channels; physical lamp telemetry only clocks the animation.
left_indicator_inner=0x08
left_indicator_pair=0x18
right_indicator_inner=0x02
right_indicator_pair=0x03
# Center mirrors headlights only when directional signals are off.
headlight_led_mask=0x04
indicator_step_ms=120

# Optional immersion cues (gentle synthetic rhythms, off by default).
effects_enabled=true
trailer_cue=true
gameplay_cue=true
reverse_cue=false
wiper_cue=false
swap_indicators=false
