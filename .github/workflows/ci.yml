name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build native daemon and SDK harnesses
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Test effects and SDK adapter
        run: ctest --test-dir build --output-on-failure
      - name: Test packed SDK callback alignment
        run: |
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"
          cmake --build build-sanitized --target effects-tests plugin-tests dualsense-transport-tests route-reader-tests semaphore-reader-tests job-journal-tests -j2
          ctest --test-dir build-sanitized --output-on-failure
      - name: Validate desktop dependencies and release identity
        run: |
          npm ci --prefix ats-dualsense/desktop --ignore-scripts --no-audit --no-fund
          npm audit --prefix ats-dualsense/desktop --audit-level=moderate
          npm test --prefix ats-dualsense/desktop
          python3 scripts/check-release.py
      - name: Check optional HUD and isolation diagnostic syntax
        run: python3 -m py_compile ats-dualsense/ui/haulsense-hud.py ats-dualsense/scripts/diagnose-player-leds.py ats-dualsense/scripts/export-road-map.py ats-dualsense/scripts/scene_map.py
      - name: Test real sockets, lifecycle and settings
        run: |
          python3 tests/integration.py build
          python3 tests/map_export.py
      - name: Test dashboard DOM and units
        run: |
          npm install --prefix .test-deps linkedom@0.18.12 --no-audit --no-fund
          NODE_PATH="$PWD/.test-deps/node_modules" node tests/ui.mjs build/ui-state.json
          NODE_PATH="$PWD/.test-deps/node_modules" node tests/hud.mjs
          NODE_PATH="$PWD/.test-deps/node_modules" node tests/navigation.mjs
          node tests/routing.cjs
          NODE_PATH="$PWD/.test-deps/node_modules" node tests/jobs.mjs
      - name: Package standalone desktop
        run: |
          node ats-dualsense/desktop/node_modules/electron/install.js
          npm run --prefix ats-dualsense/desktop package
      - name: Build freestanding Windows x64 plugin
        run: ./ats-dualsense/plugin-win/build-windows-dll.sh
      - name: Check shell scripts and generated artifact imports
        run: |
          bash -n ats-dualsense/scripts/*.sh ats-dualsense/plugin-win/build-windows-dll.sh
          objdump -p ats-dualsense/plugin-win/ats_dualsense_telemetry.dll | sed -n '/DLL Name/p'
          ./ats-dualsense/scripts/package-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: haulsense-linux-x86_64-candidate
          path: build/release/*
          retention-days: 14
